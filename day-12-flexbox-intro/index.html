<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flexbox Introduction</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <section class="inner-container">
            <h1>Flexing Elements</h1>
        </section>
    </header>
    <main>
        <section class="inner-container">
            <h2>Two Boxes</h2>

            <div class="flex-container">
                <!-- .red -->
                <div class="red">
                    <p>red</p>
                </div>
                <!-- .orange -->
                <div class="orange">
                    <p>orange</p>
                </div>
            </div>

            <h2>Three Boxes</h2>

            <div class="flex-container">
                <div class="amber">
                    <p>amber</p>
                </div>
                <div class="light-green">
                    <p>light green</p>
                </div>
                <div class="green">
                    <p>green</p>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <section class="inner-container">
            <h2>Four Boxes</h2>

            <div class="flex-container">
                <div class="cyan">
                    <p>cyan</p>
                </div>
                <div class="blue">
                    <p>blue</p>
                </div>
                <div class="indigo">
                    <p>indigo</p>
                </div>
                <div class="violet">
                    <p>violet</p>
                </div>
            </div>
        </section>
    </footer>
</body>

</html>
