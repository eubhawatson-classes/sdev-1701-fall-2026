<!DOCTYPE html>
<!-- 
  Emmet Abbreviations 

  Emmet Abbreviations are little shortcuts we can type that expand into larger code structures. 

  In HTML, we can use `!` to create a basic document with the required elements.
-->

<!-- DOCTYPE declaration: Lets the browser know what kind of content is to follow. -->
 
<!-- 

All of our HTML goes inside of <html>. Its direct children are always <head> and <body>. 

Attributes provide a little more information about HTML elements. Here, we're indicating that our language is (generic) English.
    
-->
<html lang="en">
    <!-- The <head> is where information about the HTML document goes. No actual content (things you want in your website) go here. -->
    <head>
        <!-- This meta tag is a hard requirement. It is saying the character set we're using is a Unicode standard. -->
        <meta charset="UTF-8">
        <!-- This, put simply, is to make sure the website is the correct size when the CSS is applied and allows the layout to be responsive. -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Every document should have a unique, semantic title. -->
        <title>Hello, world!</title>
    </head>
    <!-- The <body> is where all of the content for the website goes. Everything that you want to appear in the viewport should go here. -->
    <body>
        <!-- Every website must also have a first-level heading. This is the most important heading, which means there can only be one. -->
        <h1>Hello, world!</h1>
        <p>It's good to see you.</p>
    </body>
</html>
